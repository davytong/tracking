<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>💸 Salary Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:"Poppins","Khmer OS","Khmer OS System",sans-serif;
  background:#f4f7fb;
  padding:20px;
}
h1{text-align:center;color:#0d6efd;font-weight:600;margin-bottom:20px}
.card{border-radius:16px}
.fixed{background:#eef2ff;padding:8px;border-radius:8px;margin-bottom:6px;font-weight:500}
.expense{display:flex;justify-content:space-between;align-items:center;background:#f8f9fa;padding:6px 10px;border-radius:8px;margin-bottom:4px;font-size:14px}
.over-card{border:2px solid #dc3545;background:#ffe6e6}
.stat{margin-top:6px;font-weight:600}
.stat.ok{color:#198754}
.stat.over{color:#dc3545}
.progress{height:12px;border-radius:20px}
.lang-btn{position:fixed;top:15px;right:15px;z-index:10}
.subtotal-card{background:#fff3cd;border:2px solid #ffc107;color:#856404;font-weight:700;text-align:center;padding:10px;border-radius:14px;margin-top:12px}
.food-plan{background:#eef6ff;padding:8px;border-radius:10px;font-size:14px;margin-top:6px}
</style>
</head>

<body>

<button class="btn btn-outline-primary lang-btn" id="langBtn">ខ្មែរ</button>
<h1 id="title"></h1>

<div class="container">
  <div class="d-flex mb-3">
    <select id="monthSelect" class="form-select w-50"></select>
    <button id="resetMonth" class="btn btn-danger ms-2">Reset ↺</button>
  </div>

  <div class="row" id="tracker"></div>

  <div class="card mt-4">
    <div class="card-body text-center fw-bold">
      <span id="spentLabel"></span>: $<span id="grandSpent">0</span> |
      <span id="remainLabel"></span>: $<span id="grandRemain">0</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="expModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modalTitle"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="expName" class="form-control mb-2">
        <div class="input-group mb-2">
          <input id="expCost" type="number" class="form-control">
          <select id="expCurrency" class="form-select">
            <option value="USD">$ USD</option>
            <option value="KHR">៛ KHR</option>
          </select>
        </div>
        <input id="expDate" type="date" class="form-control">
      </div>
      <div class="modal-footer">
        <button id="deleteBtn" class="btn btn-danger">Delete</button>
        <button id="saveBtn" class="btn btn-success">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* CONFIG */
const SALARY=320, DAILY_MAX=4, EXCHANGE_RATE=4000;

/* I18N */
const i18n={
en:{title:"Salary Tracker",spent:"Spent",remain:"Remaining",over:"OVER",add:"Add",edit:"Edit Expense",subtotal:"Subtotal",needRemain:"Must Remain",
items:{Food:"Food",Gas:"Gas",House:"House",Saving:"Saving",Oil:"Oil",Other:"Other"}},
km:{title:"តារាងគ្រប់គ្រងប្រាក់ខែ",spent:"ចំណាយ",remain:"នៅសល់",over:"លើស",add:"បន្ថែម",edit:"កែចំណាយ",subtotal:"សរុប",needRemain:"ត្រូវនៅសល់",
items:{Food:"អាហារ",Gas:"សាំង",House:"ផ្ទះ",Saving:"សន្សំ",Oil:"ប្រេងម៉ូតូ",Other:"ផ្សេងៗ"}}
};
let lang=localStorage.getItem("lang")||"en";

/* DATA */
const halves=[
{key:"first",fixed:["Saving"],vars:["Food","Gas","Other"]},
{key:"second",fixed:["House"],vars:["Food","Oil","Other"]}
];
const budgets={Food:60,Gas:15,House:70,Saving:60,Oil:15,Other:25};

/* HELPERS */
const key=(h,c)=>`${monthSelect.value}-${h}-${c}`;
const load=k=>JSON.parse(localStorage.getItem(k)||"[]");
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function getSalaryHalfInfo(d=new Date()){
  const day=d.getDate(),m=d.getMonth(),y=d.getFullYear();
  if(day>=5&&day<=20) return{half:"first",daysLeft:20-day+1};
  const end=day>20?new Date(y,m+1,4):new Date(y,m,4);
  return{half:"second",daysLeft:Math.floor((end-d)/86400000)+1};
}

/* RENDER */
function render(){
  const t=i18n[lang];
  title.textContent=t.title;
  spentLabel.textContent=t.spent;
  remainLabel.textContent=t.remain;
  langBtn.textContent=lang==="en"?"ខ្មែរ":"EN";
  tracker.innerHTML="";
  let grand=0;
  const todayInfo=getSalaryHalfInfo();

  halves.forEach(h=>{
    let halfTotal=0;
    let html=`<div class="col-md-6 mb-3"><div class="card">
    <div class="card-header bg-primary text-white">${h.key==="first"?"1st Half (5–20)":"2nd Half (21–4)"}</div>
    <div class="card-body">`;

    /* FIXED BUDGETS – ALWAYS COUNT */
    h.fixed.forEach(f=>{
      halfTotal+=budgets[f];
      html+=`<div class="fixed">${t.items[f]} $${budgets[f]}</div>`;
    });

    h.vars.forEach(v=>{
      const list=load(key(h.key,v));
      const spent=list.reduce((a,b)=>a+b.cost,0);
      const remain=budgets[v]-spent;
      halfTotal+=spent;
      let items="";
      list.forEach((e,i)=>{
        items+=`<div class="expense">${e.date} | ${e.name} $${e.cost.toFixed(2)}
        <button class="btn btn-sm btn-light" onclick="edit('${h.key}','${v}',${i})">✏️</button></div>`;
      });

      let foodPlan="";
      if(v==="Food"&&todayInfo.half===h.key){
        foodPlan=`<div class="food-plan"><b>${t.needRemain}:</b> $${(todayInfo.daysLeft*DAILY_MAX).toFixed(2)}</div>`;
      }

      html+=`<div class="card p-2 mb-2 ${remain<0?"over-card":""}">
      <b>${t.items[v]} ($${budgets[v]})</b>
      <button class="btn btn-sm btn-primary float-end" onclick="add('${h.key}','${v}')">${t.add}</button>
      ${items}
      <div class="stat ${remain<0?"over":"ok"}">${t.spent}: $${spent.toFixed(2)} |
      ${remain<0?t.over:t.remain}: $${Math.abs(remain).toFixed(2)}</div>
      ${foodPlan}
      <div class="progress"><div class="progress-bar ${remain<0?"bg-danger":"bg-success"}"
      style="width:${Math.min(spent/budgets[v]*100,100)}%"></div></div></div>`;
    });

    html+=`<div class="subtotal-card">${t.subtotal}: $${halfTotal.toFixed(2)}</div></div></div></div>`;
    tracker.innerHTML+=html;
    grand+=halfTotal;
  });

  grandSpent.textContent=grand.toFixed(2);
  grandRemain.textContent=(SALARY-grand).toFixed(2);
}

/* ACTIONS */
let ctx=null;
function add(h,c){
  ctx={h,c,i:null};
  expName.value="";
  expCost.value="";
  expCurrency.value="USD";
  expDate.value=new Date().toISOString().split("T")[0];
  modalTitle.textContent=i18n[lang].edit;
  new bootstrap.Modal(expModal).show();
  setTimeout(()=>expName.focus(),200);
}
function edit(h,c,i){
  const l=load(key(h,c));
  ctx={h,c,i};
  expName.value=l[i].name;
  expCost.value=l[i].cost;
  expDate.value=l[i].date;
  new bootstrap.Modal(expModal).show();
}
saveBtn.onclick=()=>{
  if(!expCost.value) return alert("Enter cost");
  let cost=+expCost.value;
  if(expCurrency.value==="KHR") cost=Math.round(cost/EXCHANGE_RATE*100)/100;
  const l=load(key(ctx.h,ctx.c));
  ctx.i===null?l.push({name:expName.value,cost,date:expDate.value}):(l[ctx.i]={name:expName.value,cost,date:expDate.value});
  save(key(ctx.h,ctx.c),l);
  bootstrap.Modal.getInstance(expModal).hide();
  render();
};
deleteBtn.onclick=()=>{
  if(ctx.i===null||!confirm("Delete this expense?")) return;
  const l=load(key(ctx.h,ctx.c));
  l.splice(ctx.i,1);
  save(key(ctx.h,ctx.c),l);
  bootstrap.Modal.getInstance(expModal).hide();
  render();
};
langBtn.onclick=()=>{lang=lang==="en"?"km":"en";localStorage.setItem("lang",lang);render();}
monthSelect.onchange=render;
resetMonth.onclick=()=>{halves.forEach(h=>[...h.fixed,...h.vars].forEach(c=>localStorage.removeItem(key(h.key,c))));render();}

/* INIT */
const y=new Date().getFullYear();
for(let m=1;m<=12;m++)monthSelect.innerHTML+=`<option>${y}-${m}</option>`;
monthSelect.value=`${y}-${new Date().getMonth()+1}`;
render();
</script>
</body>
</html>
